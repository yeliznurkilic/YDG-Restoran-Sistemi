<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Menü</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        .menu-item {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            background: #fafafa;
        }
    </style>
</head>
<body class="container my-4">

<h1 class="mb-4">Menü</h1>

<div class="row">
    <div class="col-md-6 col-lg-4"
         th:each="item : ${items}">
        <div class="menu-item">
            <h5 th:text="${item.name}">Ürün Adı</h5>
            <p class="text-muted" th:text="'Kategori: ' + ${item.category.name}">Kategori</p>
            <p th:text="'Fiyat: ' + ${item.price} + '₺'">50₺</p>
        </div>
    </div>
</div>

</body>
</html>
