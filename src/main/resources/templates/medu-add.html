<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Yeni Ürün</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

<h2>Yeni Menü Ürünü Ekle</h2>

<form method="post" th:action="@{/menu/add}">
    <div class="mb-3">
        <label>Ürün Adı:</label>
        <input class="form-control" type="text" th:field="*{item.name}">
    </div>

    <div class="mb-3">
        <label>Fiyat:</label>
        <input class="form-control" type="number" step="0.01" th:field="*{item.price}">
    </div>

    <div class="mb-3">
        <label>Kategori:</label>
        <select class="form-select" name="categoryId">
            <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
        </select>
    </div>

    <button class="btn btn-primary">Kaydet</button>
</form>

<a class="btn btn-secondary mt-3" href="/menu">Geri</a>

</body>
</html>
