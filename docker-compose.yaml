version: '3.8'

services:
  db:
    image: postgres:17
    container_name: restoran_db_container
    environment:
      POSTGRES_DB: restoran_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456 # Buraya kendi şifreni yaz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - restaurant_network
  app:
    build: .
    container_name: restaurant_app
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/restoran_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    networks:
      - restaurant_network

networks:
  restaurant_network:

volumes:
  postgres_data: