services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: restoran_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    networks:
      - app_network

  app:
    build: .
    restart: always
    depends_on:
      - db
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/restoran_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
